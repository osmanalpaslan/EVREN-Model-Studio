[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evren-model-studio"
dynamic = ["version"]
description = "EVREN Studio — EVREN LLM API için kod ajanı ve sohbet masaüstü uygulaması"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "httpx>=0.27",
    "keyring>=25",
    "markdown>=3.6",
    "pygments>=2.17",
    "json-repair>=0.52",   # model çıktısındaki bozuk JSON (agent/jsonfix.py; MIT, bağımlılıksız)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
evren-studio = "evren_studio.app:main"

[tool.setuptools.dynamic]
version = {attr = "evren_studio.__version__"}   # tek kaynak (kurulum paketi de buradan okur)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evren-model-studio"
dynamic = ["version"]
description = "EVREN Studio — EVREN LLM API için kod ajanı ve sohbet masaüstü uygulaması"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "httpx>=0.27",
    "keyring>=25",
    "markdown>=3.6",
    "pygments>=2.17",
    "json-repair>=0.52",
    "ruff>=0.17",
    "pdfminer.six>=20250000",   # PDF / Word / PowerPoint okuma (agent/documents.py; hepsi MIT)
    "python-docx>=1.2",
    "python-pptx>=1.0",          # hata bekçisi: tanımsız ad / yapı hatası (agent/diagnostics.py; MIT)   # model çıktısındaki bozuk JSON (agent/jsonfix.py; MIT, bağımlılıksız)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
evren-studio = "evren_studio.app:main"

[tool.setuptools.dynamic]
version = {attr = "evren_studio.__version__"}   # tek kaynak (kurulum paketi de buradan okur)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evren-model-studio"
version = "0.2.0"
description = "EVREN Studio — EVREN LLM API için kod ajanı ve sohbet masaüstü uygulaması"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "httpx>=0.27",
    "keyring>=25",
    "markdown>=3.6",
    "pygments>=2.17",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
evren-studio = "evren_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
